<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="alternate" type="application/rss+xml" title="${site_title} RSS Feed" href="feed.xml" />
    <title>${title} - ${site_title}</title>
    <style>
        :root {
            --bg-color: #fdfdfd;
            --text-color: #333;
            --link-color: #0066cc;
            --meta-color: #777;
            --code-bg: #f4f4f4;
            --border-color: #eee;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background: var(--bg-color);
            max-width: 700px;
            margin: 0 auto;
            padding: 1rem;
        }
        header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
        }
        h1, h2, h3 { line-height: 1.2; margin-top: 1.5em; margin-bottom: 0.5em; }
        h1 { margin-top: 0; }
        a { color: var(--link-color); text-decoration: none; }
        a:hover { text-decoration: underline; }
        nav a { margin-left: 1rem; }
        .post-meta { color: var(--meta-color); font-size: 0.9rem; }
        .post-list { list-style: none; padding: 0; }
        .post-list li { margin-bottom: 0.5rem; display: flex; justify-content: space-between; }
        .post-list li span:first-child { min-width: 100px; color: var(--meta-color); }
        pre { background: var(--code-bg); padding: 1rem; overflow-x: auto; border-radius: 4px; }
        code { font-family: "Menlo", "Consolas", "Monaco", monospace; font-size: 0.9em; background: var(--code-bg); padding: 0.2em 0.4em; border-radius: 2px; }
        pre code { background: transparent; padding: 0; }
        blockquote { border-left: 4px solid var(--border-color); margin: 0; padding-left: 1rem; color: var(--meta-color); }
        img { max-width: 100%; height: auto; }
        footer { margin-top: 3rem; pt: 1rem; border-top: 1px solid var(--border-color); font-size: 0.8rem; text-align: center; color: var(--meta-color); }

        /* Utility classes */
        .hidden { display: none; }

        /* Dark Mode */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #111;
                --text-color: #ddd;
                --link-color: #66b3ff;
                --meta-color: #aaa;
                --code-bg: #222;
                --border-color: #333;
            }
            img { opacity: 0.8; transition: opacity 0.3s; }
            img:hover { opacity: 1; }
        }

        /* About Section */
        details.about-section {
            margin-bottom: 2rem;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--code-bg);
        }
        details.about-section summary {
            cursor: pointer;
            font-weight: bold;
            outline: none;
        }
        .about-content {
            margin-top: 1rem;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }
        .about-avatar {
            width: 60px;
            height: 60px;
            background-color: #ccc;
            border-radius: 50%;
            flex-shrink: 0;
            overflow: hidden;
        }
        .about-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .about-text {
            flex-grow: 1;
        }
        .about-text p {
            margin: 0 0 0.5rem 0;
            font-size: 0.95rem;
        }
        .social-links {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            gap: 0.8rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <strong><a href="index.html" style="color: inherit; text-decoration: none; font-size: 1.2rem;">${site_title}</a></strong>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="books.html">Books</a>
        </nav>
    </header>

    ${about_section}

    <main>
        ${content}
    </main>

    <footer>
        &copy; ${year} ${author_name}
    </footer>
</body>
</html>
